name: sieve

# The walking skeleton (roadmap §5, architecture §5.3): plan → matrix of shards → gate, on SIEVE's
# own tests, in shadow mode.
# - The plan diffs HEAD against the map of the last push to main, kept in actions/cache. It
#   writes the job summary: what static reachability would have run and skipped, with why-paths.
#   Every would-skip is unproven (DECISIONS 1 and 24), so in shadow mode every test file runs.
# - With no usable map, the plan runs every test file and the summary says why.
# - sieve-gate fails unless the plan and every shard succeeded.
# - A push to main builds the next map and caches it.
# See DECISIONS 25.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: sieve-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The map records the Node version and platform as environment nodes that every test depends on.
# Plan and build it on the same runner image and Node version, or every test counts as affected.
env:
  NODE_VERSION: 26

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The CLI has no runtime dependencies (ADR-0002); this only links the workspace packages.
      - run: npm ci --omit=dev --ignore-scripts
      - uses: actions/cache/restore@v6
        with:
          path: .sieve/map
          key: sieve-map-${{ github.sha }}
          restore-keys: sieve-map-
      - id: plan
        run: node packages/cli/src/main.ts plan --mode shadow --static --map .sieve/map

  test:
    name: test (shard ${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # vitest.config.ts turns this list into its include: the shard runs exactly these files.
      - run: npx vitest run
        env:
          SIEVE_TEST_FILES: ${{ toJSON(matrix.files) }}

  # The check to require on main: a job skipped by `if` reports success, so this one always runs.
  sieve-gate:
    needs: [plan, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the plan and every shard to succeed
        env:
          PLAN: ${{ needs.plan.result }}
          TEST: ${{ needs.test.result }}
          COUNT: ${{ needs.plan.outputs.count }}
        run: |
          echo "plan: $PLAN; test shards: $TEST; test files: ${COUNT:-none}"
          if [ "$PLAN" != success ]; then
            echo "::error::the plan job did not succeed ($PLAN)"
            exit 1
          fi
          if [ "$TEST" = success ] || { [ "$TEST" = skipped ] && [ "$COUNT" = 0 ]; }; then
            exit 0
          fi
          echo "::error::the test shards did not all succeed ($TEST)"
          exit 1

  map:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --omit=dev --ignore-scripts
      - run: node packages/cli/src/main.ts graph --out .sieve/map/map.json
      - uses: actions/cache/save@v6
        with:
          path: .sieve/map
          key: sieve-map-${{ github.sha }}
